name: House Edge (Windows build)

# Two jobs:
#   windows  - the desktop panel, HouseEdge.exe
#   ingame   - the in-game mod menu (BepInEx plugin), packaged as a folder to drop into the game folder

on:
  push:
    paths:
      - "house-edge/**"
      - ".github/workflows/house-edge.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: house-edge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Self-test against a stand-in game (real Windows memory APIs)
        run: python selftest.py

      - name: Build HouseEdge.exe
        run: pyinstaller --noconfirm --onefile --windowed --name HouseEdge --add-data "house_edge/ui;house_edge/ui" run.py

      - name: Smoke-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\HouseEdge.exe -ArgumentList '--headless','--port','8765' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/; $ok = $r.StatusCode -eq 200 -and $r.Content -match 'House Edge' } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "HouseEdge.exe did not serve the panel" }
          "HouseEdge.exe started and served the panel."

      - uses: actions/upload-artifact@v4
        with:
          name: HouseEdge-windows
          path: house-edge/dist/HouseEdge.exe
          if-no-files-found: error

  ingame:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: house-edge/ingame
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download BepInEx 5 (Windows, 64-bit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/BepInEx/BepInEx/releases?per_page=40" \
            | jq -r '[.[] | select(.prerelease | not) | select(.tag_name | startswith("v5.4"))][0].assets[]
                     | select(.name | test("(win_x64|_x64_).*\\.zip$")) | select(.name | test("unix|linux|macos"; "i") | not)
                     | .browser_download_url' | head -1)
          test -n "$url"
          echo "Using $url"
          curl -fsSL -o bepinex.zip "$url"
          mkdir -p package
          unzip -o -q bepinex.zip -d package
          test -f package/BepInEx/core/BepInEx.dll
          test -f package/winhttp.dll

      - name: Build the plugin against the real BepInEx
        run: dotnet build HouseEdgeInGame.csproj -c Release -p:BepInExDir=$PWD/package/BepInEx/core

      - name: Assemble the drop-in folder
        run: |
          mkdir -p package/BepInEx/plugins/HouseEdgeInGame
          cp bin/HouseEdgeInGame.dll package/BepInEx/plugins/HouseEdgeInGame/
          cp -r extras/BepInEx/. package/BepInEx/
          cp INSTALL.txt "package/HOUSE EDGE - READ ME.txt"
          find package -maxdepth 3 | sort

      - uses: actions/upload-artifact@v4
        with:
          name: HouseEdge-InGame-drop-into-game-folder
          path: house-edge/ingame/package/
          include-hidden-files: true
          if-no-files-found: error
